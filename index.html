<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modded Evolve Telemetry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&display=swap');
:root {
  /* same palette as the Stage 2 website */
  --bg: #000; --card: #0d0d0d; --card2: #161616; --border: #1f1f1f; --accent: #8b1a1a; --text: #fff; --muted: #aaa;
  --cl-monster: #8b1a1a; --cl-assault: #ab2d16; --cl-medic: #387672; --cl-support: #c87a05; --cl-trapper: #807921;
  --cue: #8a728c;   /* the game's observer-role purple (COLOR_CLASS_OBSERVER): "there is more behind this" cues */
  --font: 'Archivo Narrow', sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--font); }
a { color: inherit; text-decoration: none; }
img { display: block; }
.c-Assault { --c: var(--cl-assault); } .c-Trapper { --c: var(--cl-trapper); } .c-Medic { --c: var(--cl-medic); }
.c-Support { --c: var(--cl-support); } .c-Monster { --c: var(--cl-monster); }

.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.94); border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1.4rem; padding: .6rem 1.25rem; }
.brand { font-weight: 700; letter-spacing: .14em; font-size: 1.05rem; }
.brand b { color: var(--accent); }
.top nav { display: flex; flex-wrap: wrap; gap: .1rem; }
.top nav a { padding: .25rem .55rem; border-radius: 4px; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; font-size: .8rem; font-weight: 600; }
.top nav a:hover { color: #fff; } .top nav a.on { color: #fff; background: var(--accent); }
.sample { background: #2a1d00; color: #ffcf70; border-bottom: 1px solid #5a3f00; padding: .45rem 1.25rem; font-size: .9rem; }

main { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1; margin: 0 0 .4rem; letter-spacing: .02em; text-transform: uppercase; }
h2 { font-size: 1.2rem; letter-spacing: .1em; text-transform: uppercase; margin: 2.2rem 0 .8rem; padding-left: .6rem; border-left: 3px solid var(--accent); }
h3 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 1.2rem; max-width: 68ch; }
.hero { margin: -1.5rem -1.25rem 1.5rem; padding: 3rem 1.25rem 2rem;
  background: linear-gradient(180deg, rgba(0,0,0,.55), #000), url('https://assets.modded-evolve.com/images/ui/mainbackground.png') center/cover; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .7rem; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: .8rem 1rem; }
.tile .k { color: var(--muted); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
.tile .v { font-size: 1.7rem; font-weight: 700; line-height: 1.15; }
.tile .n { color: var(--muted); font-size: .82rem; }
a.tile:hover { border-color: var(--c, var(--accent)); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 1.5rem; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: .9rem 1rem; }
.kv { display: flex; align-items: center; gap: .8rem; padding: .32rem 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.kv:last-child { border: 0; } .kv .l { flex: 1; } .kv .r { color: var(--muted); font-size: .88rem; text-align: right; }

.bar { display: inline-block; width: 90px; height: 7px; background: #222; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: .5rem; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); }
.chart { display: flex; align-items: stretch; gap: 3px; height: 150px; }
.chart .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.chart .b { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.chart i { display: block; width: 100%; background: var(--c, var(--accent)); border-radius: 2px 2px 0 0; }
.chart span { font-size: .66rem; color: var(--muted); white-space: nowrap; overflow: hidden; max-width: 100%; padding-top: 3px; }

.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { padding: .5rem .7rem; text-align: left; white-space: nowrap; }
thead th { background: var(--card2); color: var(--muted); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; }
thead button { all: unset; cursor: pointer; } thead button:hover, th.on button { color: #fff; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
tbody tr { border-top: 1px solid var(--border); } tbody tr:hover { background: #111; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; }
.chip img, .face { width: 46px; height: 28px; object-fit: cover; border-radius: 3px; background: #111; }
a.chip:hover span { text-decoration: underline; }
.perk { width: 26px; height: 26px; object-fit: contain; display: inline-block; vertical-align: middle; }
.plv { color: var(--muted); font-size: .72rem; vertical-align: bottom; }
.icon { width: 30px; height: 30px; object-fit: contain; border-radius: 4px; background: #111; display: inline-block; vertical-align: middle; margin-right: .5rem; }
.cls { width: 22px; height: 22px; object-fit: contain; display: inline-block; vertical-align: middle; }
.tag { display: inline-block; padding: .1rem .5rem; border-radius: 3px; background: var(--c, #333); font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.tag.gold { background: #6b5510; color: #ffd76a; }

.tabs, .filters { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .9rem; align-items: center; }
.tabs button, .play { font: 600 .82rem var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--card);
  border: 1px solid var(--border); border-radius: 4px; padding: .35rem .8rem; cursor: pointer; }
.tabs button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.tabs button:disabled { opacity: .4; cursor: default; }
.tabs button { display: inline-flex; align-items: center; gap: .4rem; }
.tabs button img.tier { width: 34px; height: 34px; object-fit: contain; }
.tag { display: inline-flex; align-items: center; gap: .35rem; vertical-align: middle; } .tag .cls, .tabs .cls { width: 20px; height: 15px; }
tr[data-href] { cursor: pointer; } tr[data-href]:hover { background: #171717; }
.chip .nm { display: inline-flex; flex-direction: column; align-items: flex-start; }
.more { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--cue); }
img.obs, .chip img.obs, .bigchips .chip img.obs { display: inline-block; width: auto; height: 1.25em; vertical-align: -.28em; margin-right: .4em; background: none; border-radius: 0; }
.hint img.obs { height: 1.6em; vertical-align: -.45em; margin-right: .55em; }
.hint { margin: 0 0 .7rem; padding: .45rem .7rem; border-left: 3px solid var(--cue); background: var(--card); color: var(--cue); font-size: .92rem; }
.clscell { display: inline-flex; align-items: center; gap: .6rem; } .clsname { font-weight: 700; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
.clscell .cls { width: 24px; height: 18px; } .cls-lg { width: 48px; height: 36px; object-fit: contain; border-radius: 3px; }
.bigchips .chip { gap: .8rem; font-size: 1.05rem; } .bigchips .chip img { width: 96px; height: 59px; }
.bigchips .cls-lg { width: 80px; height: 60px; }
.play { padding: .15rem .6rem; } .play:hover { color: #fff; }
select, input[type=search] { font: 400 .95rem var(--font); color: #fff; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: .4rem .7rem; }
.filters { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: .5rem .7rem; }
.filters input[type=search] { flex: 1 1 140px; min-width: 0; } .filters select { max-width: 100%; }
.filters label { color: var(--muted); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: .4rem; margin-right: .6rem; }

.mrow { display: grid; grid-template-columns: 92px 1fr auto; gap: .8rem; align-items: center; padding: .5rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card); margin-bottom: .4rem; }
.mrow:hover { background: #131313; }
.res { font-weight: 700; letter-spacing: .1em; font-size: .8rem; text-transform: uppercase; }
.res.h, .res.w { color: #6fc3bd; } .res.m, .res.l { color: #e0584f; }
.comp { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; } .comp .vs { color: var(--muted); padding: 0 .3rem; font-size: .8rem; }
.meta { color: var(--muted); font-size: .86rem; text-align: right; }

.grid { border-collapse: separate; border-spacing: 2px; font-size: .85rem; }
.grid th, .grid td { padding: .3rem .45rem; }
.grid td.cell { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 3px; min-width: 74px; line-height: 1.15; }
.grid td.cell small { display: block; font-size: .66rem; font-weight: 400; letter-spacing: .02em; color: rgba(255,255,255,.8); }
.grid thead th { background: none; vertical-align: bottom; text-align: center; white-space: normal; width: 86px; }
.grid thead th img { margin: 0 auto .25rem; } .grid tbody tr { border: 0; } .grid tbody tr:hover { background: none; }
.grid .sep td { padding-top: .9rem; color: var(--muted); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; }

.skill th:not(:first-child), .skill td:not(:first-child) { text-align: center; }
.skill thead th small { display: block; font-size: .66rem; letter-spacing: 0; text-transform: none; font-weight: 400; }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pips i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #555; }
.pips i.on { background: #e0584f; border-color: #e0584f; }
.ranks { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: .8rem; }
.rk-row { display: flex; align-items: center; gap: .5rem; padding: .4rem .7rem; border-top: 1px solid var(--border); }
.rk-n { flex: 0 0 1.3rem; font-weight: 700; font-size: 1.1rem; color: var(--muted); } .rk-row:first-of-type .rk-n { color: #fff; }
.rk-name { flex: 1; min-width: 0; font-weight: 600; line-height: 1.2; } .rk-name small { display: block; font-weight: 400; font-size: .76rem; color: var(--muted); } .rk-v { white-space: nowrap; font-variant-numeric: tabular-nums; } .rk-row .icon { margin-right: 0; }
.rk-row .bar { width: 70px; }
.builds { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: .8rem; }
.build { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
.build .pips { gap: 3px; } .build .pips i { width: 11px; height: 11px; } .build .icon { width: 24px; height: 24px; margin-right: .4rem; }
.build .bh { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; padding: .5rem .7rem; background: var(--card2); }
.build .bh span { color: var(--muted); font-size: .86rem; }
.build th, .build td { padding: .35rem .45rem; } .build thead th { background: none; }
@media (max-width: 640px) { .builds { grid-template-columns: minmax(0, 1fr); } }
.heatwrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
.heat { position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #080808; }
.heat img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
.heat svg { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }
.heat .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; color: var(--muted); background: rgba(0,0,0,.6); }

.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: .85rem; margin-bottom: 1.2rem; }
.podium > div { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem .75rem; text-align: center; min-width: 0; overflow-wrap: anywhere; }
.podium .rk { font-size: 2.2rem; font-weight: 700; line-height: 1; }
.podium img { width: 84px; height: 84px; object-fit: contain; margin: .25rem auto; }
.podium .wr { font-size: 1.4rem; font-weight: 700; }
.div { display: flex; align-items: center; gap: .6rem; } .div img { width: 44px; height: 44px; object-fit: contain; }
.legend3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; } .legend3 .div { padding: .2rem 0; }

.headline { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.headline img.big { width: 150px; height: 92px; object-fit: cover; border-radius: 6px; }
details { border: 1px solid var(--border); border-radius: 6px; margin-bottom: .5rem; background: var(--card); }
summary { cursor: pointer; padding: .55rem .8rem; display: flex; align-items: center; gap: .7rem; }
details .tw { border: 0; border-top: 1px solid var(--border); border-radius: 0; }
details .in { padding: .8rem; border-top: 1px solid var(--border); }
svg.tl { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; color: var(--muted); font-size: .84rem; margin-top: .5rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .35rem; background: var(--c); }
.note { color: var(--muted); font-size: .86rem; margin: .5rem 0 0; }
ul.plain { margin: .3rem 0; padding-left: 1.2rem; } ul.plain li { margin: .25rem 0; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .84rem; padding: 1rem 1.25rem; text-align: center; }
.menu-btn { display: none; }
/* narrow screens: wide tables scroll sideways inside their box, with the first column pinned so each row stays readable */
@media (max-width: 900px) {
  .tw th:first-child, .tw td:first-child { position: sticky; left: 0; z-index: 1; background: #000; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .tw thead th:first-child { background: var(--card2); } .tw .grid thead th:first-child { background: #000; }
  details .tw td:first-child { background: var(--card); }
  .tw tbody tr:hover td:first-child { background: #111; }
}
@media (max-width: 640px) {
  html { -webkit-text-size-adjust: 100%; }
  .top { padding: .5rem 1rem; gap: .3rem .6rem; } .brand { font-size: .82rem; letter-spacing: .1em; }
  .menu-btn { display: block; margin-left: auto; font: 600 .85rem var(--font); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--card2);
    border: 1px solid var(--border); border-radius: 4px; padding: .5rem .9rem; cursor: pointer; }
  .top nav { display: none; width: 100%; flex-direction: column; flex-wrap: nowrap; gap: 0; max-height: 70vh; overflow-y: auto; }
  .top.open nav { display: flex; }
  .top nav a { padding: .7rem .6rem; font-size: .95rem; border-top: 1px solid var(--border); border-radius: 0; }
  main { padding: 1rem 1rem 3rem; }
  .hero { margin: -1rem -1rem 1rem; padding: 2rem 1rem 1.2rem; }
  h2 { margin-top: 1.6rem; }
  .sample { padding: .4rem 1rem; font-size: .82rem; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; } .tile { padding: .65rem .75rem; } .tile .v { font-size: 1.35rem; overflow-wrap: anywhere; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .filters { gap: .5rem; } .filters label { flex: 1 1 100%; margin: 0; justify-content: space-between; } .filters label select { flex: 0 1 62%; }
  .filters > select, .filters > input[type=search] { flex: 1 1 100%; }
  select, input[type=search] { font-size: 1rem; padding: .55rem .7rem; }      /* 16px text stops phones zooming in on focus */
  .tabs button { padding: .55rem .8rem; } .play { padding: .45rem .8rem; }
  thead button { padding: .25rem 0; }
  .mrow { grid-template-columns: 1fr; gap: .3rem; } .meta { text-align: left; } th, td { padding: .5rem .55rem; }
  .heatwrap, .legend3 { grid-template-columns: 1fr; } .podium { gap: .4rem; } .podium > div { padding: .7rem .3rem; } .podium img { width: 52px; height: 52px; } .podium .rk { font-size: 1.5rem; }
  .headline img.big { width: 110px; height: 68px; }
  .chart { height: 120px; gap: 2px; } .chart span { font-size: .56rem; }
  .kv { flex-wrap: wrap; gap: .1rem .8rem; }
  .chip { gap: .4rem; } .chip img, .face { width: 36px; height: 22px; }
  .tw th:first-child, .tw td:first-child { max-width: 40vw; }
  .bigchips .chip { flex-direction: column; align-items: flex-start; gap: .25rem; font-size: .92rem; } .bigchips .chip img { width: 84px; height: 52px; }
  .bigchips .cls-lg { width: 64px; height: 48px; } .clscell { gap: .4rem; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">MODDED EVOLVE <b>TELEMETRY</b></a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav aria-label="Sections" id="nav"></nav>
</header>
<div class="sample" id="sample" hidden>Sample data. Every match, player and number on this site is invented to show the layout; none of it is a real match.</div>
<main id="app"></main>
<footer>Modded Evolve Telemetry. Built on the records Evolve Stage 2 writes itself (build 353012).</footer>

<script src="data/catalog.js"></script>
<script src="https://assets.modded-evolve.com/telemetry/events.js?v=318b4c2b88df"></script>
<script src="app.js"></script>
</body>
</html>
